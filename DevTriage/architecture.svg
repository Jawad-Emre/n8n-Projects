  <g transform="translate(940, 450)">
    <rect width="190" height="95" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
    <text x="95" y="26" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="800">Low Confidence (25%)</text>
    <text x="95" y="46" text-anchor="middle" fill="#fde68a" font-size="10">- Anti-Hallucination Lock</text>
    <text x="95" y="64" text-anchor="middle" fill="#fde68a" font-size="10">- Zero Bad Code Output</text>
    <text x="95" y="82" text-anchor="middle" fill="#fde68a" font-size="10">- Escalates to Human</text>
  </g>


  <!-- ==================== WORKFLOW 3: ACTIVE LEARNING FLYWHEEL ==================== -->
  <rect x="40" y="680" width="1200" height="230" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="60" y="670" width="280" height="24" rx="6" fill="#7c3aed"/>
  <text x="200" y="686" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="0.5">WORKFLOW 3: ACTIVE LEARNING FLYWHEEL</text>

  <!-- Clean Escalation Connector Route (Completely avoids all boxes) -->
  <path d="M 1035 545 L 1035 600 L 155 600 L 155 720" stroke="#c084fc" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-purple)"/>
  <rect x="480" y="590" width="260" height="20" rx="4" fill="#3b0764" stroke="#9333ea" stroke-width="1"/>
  <text x="610" y="604" text-anchor="middle" fill="#e9d5ff" font-size="10" font-weight="600">Escalated Incident Sent to Senior Engineer Queue</text>

  <!-- Node 3.1: Engineer Review Form -->
  <g transform="translate(65, 725)">
    <rect width="180" height="85" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="90" y="32" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700">Engineer Review</text>
    <text x="90" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">Inputs Verified Fix</text>
    <text x="90" y="70" text-anchor="middle" fill="#64748b" font-size="10">Postmortem Metadata</text>
  </g>

  <path d="M 245 767 L 305 767" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 3.2: Format Runbook -->
  <g transform="translate(310, 725)">
    <rect width="180" height="85" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="90" y="32" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">Format Runbook</text>
    <text x="90" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">Standardized Template</text>
    <text x="90" y="70" text-anchor="middle" fill="#64748b" font-size="10">JavaScript Code Node</text>
  </g>

  <path d="M 490 767 L 550 767" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 3.3: Gemini Embeddings -->
  <g transform="translate(555, 725)">
    <rect width="210" height="85" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="105" y="32" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700">Gemini Embeddings</text>
    <text x="105" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">3,072D Vector Generation</text>
  </g>

  <path d="M 765 767 L 825 767" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 3.4: Pinecone Upsert -->
  <g transform="translate(830, 720)">
    <rect width="255" height="95" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="127" y="32" text-anchor="middle" fill="#34d399" font-size="13" font-weight="800">Pinecone Upsert</text>
    <text x="127" y="52" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="600">Auto-Indexed Solution!</text>
    <text x="127" y="72" text-anchor="middle" fill="#94a3b8" font-size="10">System learns autonomously</text>
  </g>

  <!-- Flywheel Return Path (Clean route via far right perimeter) -->
  <path d="M 1085 767 L 1170 767 L 1170 167 L 1115 167" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6" marker-end="url(#arrow-green)"/>
  <rect x="1105" y="440" width="130" height="24" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="1170" y="456" text-anchor="middle" fill="#a7f3d0" font-size="9" font-weight="800">FLYWHEEL RE-INDEX</text>
</svg>
