    <text x="70" y="54" text-anchor="middle" fill="#94a3b8" font-size="11">Score &gt;= 0.70 ?</text>
  </g>

  <!-- High Confidence Branch (Green) -->
  <path d="M 885 410 L 935 370" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="892" y="375" width="45" height="18" rx="3" fill="#064e3b"/>
  <text x="914" y="388" text-anchor="middle" fill="#34d399" font-size="9" font-weight="700">&gt;=0.70</text>

  <!-- Node 2.6: Verified Fix -->
  <g transform="translate(940, 325)">
    <rect width="190" height="95" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="95" y="26" text-anchor="middle" fill="#34d399" font-size="12" font-weight="800">Verified Fix (95%)</text>
    <text x="95" y="46" text-anchor="middle" fill="#a7f3d0" font-size="10">- Instant Resolution</text>
    <text x="95" y="64" text-anchor="middle" fill="#a7f3d0" font-size="10">- Runbook Citations</text>
    <text x="95" y="82" text-anchor="middle" fill="#a7f3d0" font-size="10">- Root Cause &amp; Steps</text>
  </g>

  <!-- Low Confidence Branch (Orange/Red) -->
  <path d="M 885 445 L 935 485" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="892" y="470" width="45" height="18" rx="3" fill="#451a03"/>
  <text x="914" y="483" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="700">&lt; 0.70</text>

