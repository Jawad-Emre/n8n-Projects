<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 940" width="1280" height="940" style="background:#0b1120; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <text x="640" y="45" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="800" letter-spacing="0.5">DevTriage AI — End-to-End System Architecture</text>
  <text x="640" y="74" text-anchor="middle" fill="#94a3b8" font-size="14">Autonomous, Confidence-Gated Incident Triage Copilot with Active Learning Flywheel (n8n + Pinecone + Gemini 3.5 Flash Lite)</text>

  <!-- ==================== WORKFLOW 1: KNOWLEDGE INGESTION ==================== -->
  <rect x="40" y="95" width="1200" height="150" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="60" y="85" width="280" height="24" rx="6" fill="#0284c7"/>
  <text x="200" y="101" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="0.5">WORKFLOW 1: KNOWLEDGE INGESTION</text>

  <!-- Node 1.1: Runbooks -->
  <g transform="translate(65, 130)">
    <rect width="180" height="75" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="90" y="32" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">Company Runbooks</text>
    <text x="90" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">Stripe / DB / Redis Docs</text>
  </g>

  <path d="M 245 167 L 305 167" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 1.2: Text Splitter -->
  <g transform="translate(310, 130)">
    <rect width="180" height="75" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="90" y="32" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">Text Splitter</text>
    <text x="90" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">500 Chars / 50 Overlap</text>
  </g>

  <path d="M 490 167 L 550 167" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 1.3: Gemini Embeddings -->
  <g transform="translate(555, 130)">
    <rect width="210" height="75" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="105" y="32" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="700">Gemini Embeddings</text>
    <text x="105" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">3,072-Dimensional Dense</text>
  </g>

  <path d="M 765 167 L 825 167" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 1.4: Pinecone Vector Store -->
  <g transform="translate(830, 125)">
    <rect width="280" height="85" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="140" y="30" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="800">Pinecone Vector Store</text>
    <text x="140" y="50" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="600">Index: devtriage-docs (3072D)</text>
    <text x="140" y="68" text-anchor="middle" fill="#94a3b8" font-size="10">Cosine Metric | Serverless</text>
  </g>


  <!-- ==================== WORKFLOW 2: COPILOT ENGINE ==================== -->
  <rect x="40" y="275" width="1200" height="375" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="60" y="265" width="280" height="24" rx="6" fill="#2563eb"/>
  <text x="200" y="281" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="0.5">WORKFLOW 2: DEVTRIAGE COPILOT</text>

  <!-- Node 2.1: Incident Form -->
  <g transform="translate(65, 380)">
    <rect width="145" height="90" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="72" y="32" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700">Incident Form</text>
    <text x="72" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">Webhook / Form</text>
    <text x="72" y="70" text-anchor="middle" fill="#64748b" font-size="10">Raw Log + Service</text>
  </g>

  <path d="M 210 425 L 245 425" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 2.2: Safety Gate -->
  <g transform="translate(250, 365)">
    <rect width="185" height="120" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="92" y="26" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="800">Safety Gate (Zero-LLM)</text>
    <text x="92" y="48" text-anchor="middle" fill="#cbd5e1" font-size="11">- Regex Secret Redaction</text>
    <text x="92" y="68" text-anchor="middle" fill="#cbd5e1" font-size="11">- P1 Outage Detection</text>
    <text x="92" y="88" text-anchor="middle" fill="#cbd5e1" font-size="11">- Timestamp Cleaning</text>
    <text x="92" y="106" text-anchor="middle" fill="#cbd5e1" font-size="10">- Error Sig Extraction</text>
  </g>

  <!-- P1 Bypass Route (Upwards) -->
  <path d="M 342 365 L 342 320 L 480 320" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="365" y="308" width="85" height="20" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="407" y="322" text-anchor="middle" fill="#f87171" font-size="9" font-weight="700">P1 / LEAK</text>

  <!-- Node 2.3: Critical Alert (Clear of other nodes) -->
  <g transform="translate(485, 295)">
    <rect width="215" height="50" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="107" y="22" text-anchor="middle" fill="#f87171" font-size="11" font-weight="700">P1 Outage / Secret Alert</text>
    <text x="107" y="38" text-anchor="middle" fill="#fca5a5" font-size="10">Bypasses AI -&gt; Senior On-Call</text>
  </g>

  <!-- Safe Log Route to AI Agent -->
  <path d="M 435 425 L 480 425" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="442" y="405" width="34" height="18" rx="3" fill="#064e3b"/>
  <text x="459" y="418" text-anchor="middle" fill="#34d399" font-size="9" font-weight="800">SAFE</text>

