    <text x="107" y="72" text-anchor="middle" fill="#94a3b8" font-size="11">Tool: search_runbooks</text>
    <text x="107" y="92" text-anchor="middle" fill="#94a3b8" font-size="10">Anti-Hallucination Prompt</text>
    <text x="107" y="110" text-anchor="middle" fill="#a855f7" font-size="10">Strict JSON Output</text>
  </g>

  <!-- Vector Query Line (Clean route above nodes) -->
  <path d="M 592 365 L 592 230 L 890 230 L 890 215" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-blue)"/>
  <rect x="680" y="220" width="130" height="20" rx="4" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
  <text x="745" y="234" text-anchor="middle" fill="#7dd3fc" font-size="9" font-weight="600">Tool: Vector RAG Query</text>

  <!-- From AI Agent to Confidence Gate -->
  <path d="M 700 427 L 740 427" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

