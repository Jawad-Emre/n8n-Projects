<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Title & Header -->
  <text x="600" y="48" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="800" letter-spacing="0.5">DevTriage AI — End-to-End System Architecture</text>
  <text x="600" y="78" text-anchor="middle" fill="#94a3b8" font-size="14">Autonomous, Confidence-Gated Incident Triage Copilot with Active Learning Flywheel (n8n + Pinecone + Gemini 3.5 Flash Lite)</text>

  <!-- ==================== WORKFLOW 1: INGESTION ==================== -->
  <rect x="50" y="105" width="1100" height="150" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="70" y="93" width="280" height="24" rx="6" fill="#0284c7"/>
  <text x="210" y="110" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="0.5">WORKFLOW 1: KNOWLEDGE INGESTION</text>

  <!-- Runbooks Source -->
  <g transform="translate(80, 140)">
    <rect width="180" height="75" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="90" y="32" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">Company Runbooks</text>
    <text x="90" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">Stripe / DB / Redis Docs</text>
  </g>

  <path d="M 260 177 L 315 177" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Text Splitter -->
  <g transform="translate(320, 140)">
    <rect width="180" height="75" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="90" y="32" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">Text Splitter</text>
    <text x="90" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">500 Chars / 50 Overlap</text>
  </g>

  <path d="M 500 177 L 555 177" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Embeddings Gemini -->
  <g transform="translate(560, 140)">
    <rect width="210" height="75" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="105" y="32" text-anchor="middle" fill="#a855f7" font-size="13" font-weight="700">Gemini Embeddings</text>
    <text x="105" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">3,072-Dimensional Dense</text>
  </g>

  <path d="M 770 177 L 830 177" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pinecone Vector Store -->
  <g transform="translate(835, 135)">
    <rect width="285" height="85" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="142" y="30" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="800">Pinecone Vector Store</text>
    <text x="142" y="50" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="600">Index: devtriage-docs (3072D)</text>
    <text x="142" y="68" text-anchor="middle" fill="#94a3b8" font-size="10">Cosine Metric | Serverless</text>
  </g>

  <!-- ==================== WORKFLOW 2: COPILOT ENGINE ==================== -->
  <rect x="50" y="295" width="1100" height="395" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="70" y="283" width="280" height="24" rx="6" fill="#2563eb"/>
  <text x="210" y="300" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="0.5">WORKFLOW 2: DEVTRIAGE COPILOT</text>

  <!-- Incident Trigger -->
  <g transform="translate(80, 365)">
    <rect width="145" height="85" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="72" y="32" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700">Incident Form</text>
    <text x="72" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">Webhook / Form</text>
    <text x="72" y="70" text-anchor="middle" fill="#64748b" font-size="10">Raw Log + Service</text>
  </g>

  <path d="M 225 407 L 265 407" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Safety Gate -->
  <g transform="translate(270, 350)">
    <rect width="185" height="115" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="92" y="26" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="800">Safety Gate (Zero-LLM)</text>
    <text x="92" y="48" text-anchor="middle" fill="#cbd5e1" font-size="11">- Regex Secret Redaction</text>
    <text x="92" y="68" text-anchor="middle" fill="#cbd5e1" font-size="11">- P1 Outage Detection</text>
    <text x="92" y="88" text-anchor="middle" fill="#cbd5e1" font-size="11">- Timestamp Cleaning</text>
    <text x="92" y="106" text-anchor="middle" fill="#cbd5e1" font-size="10">- Error Sig Extraction</text>
  </g>

  <!-- P1 Bypass Route (Upwards) -->
  <path d="M 362 350 L 362 325 L 490 325" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="410" y="320" fill="#ef4444" font-size="10" font-weight="700">P1 / LEAK</text>

  <g transform="translate(495, 305)">
    <rect width="215" height="46" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="107" y="20" text-anchor="middle" fill="#f87171" font-size="11" font-weight="700">P1 Outage / Secret Alert</text>
    <text x="107" y="36" text-anchor="middle" fill="#fca5a5" font-size="10">Bypasses AI -> Senior On-Call</text>
  </g>

  <!-- Safe Log Route to AI Agent -->
  <path d="M 455 415 L 505 415" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="480" y="407" text-anchor="middle" fill="#10b981" font-size="10" font-weight="700">SAFE</text>

  <!-- AI Agent -->
  <g transform="translate(510, 370)">
    <rect width="210" height="125" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="105" y="28" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="800">AI Agent Node</text>
    <text x="105" y="50" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Gemini 3.5 Flash Lite</text>
    <text x="105" y="72" text-anchor="middle" fill="#94a3b8" font-size="11">Tool: search_runbooks</text>
    <text x="105" y="92" text-anchor="middle" fill="#94a3b8" font-size="10">Anti-Hallucination Prompt</text>
    <text x="105" y="110" text-anchor="middle" fill="#a855f7" font-size="10">Strict JSON Output</text>
  </g>

  <!-- Query line to Pinecone -->
  <path d="M 615 370 L 615 225 L 940 225" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-blue)"/>
  <text x="690" y="240" fill="#38bdf8" font-size="11" font-weight="600">Tool: Vector RAG Query</text>

  <!-- From AI Agent to Confidence Gate -->
  <path d="M 720 432 L 765 432" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Confidence Gate -->
  <g transform="translate(770, 395)">
    <rect width="140" height="75" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="70" y="32" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="700">Confidence Gate</text>
    <text x="70" y="54" text-anchor="middle" fill="#94a3b8" font-size="11">Score >= 0.70 ?</text>
  </g>

  <!-- High Confidence Branch (Green) -->
  <path d="M 910 420 L 950 385" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="918" y="398" fill="#10b981" font-size="10" font-weight="700">>= 0.70</text>

  <g transform="translate(955, 345)">
    <rect width="180" height="90" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="90" y="24" text-anchor="middle" fill="#34d399" font-size="12" font-weight="800">Verified Fix (95%)</text>
    <text x="90" y="44" text-anchor="middle" fill="#a7f3d0" font-size="10">- Instant Resolution</text>
    <text x="90" y="62" text-anchor="middle" fill="#a7f3d0" font-size="10">- Runbook Citations</text>
    <text x="90" y="80" text-anchor="middle" fill="#a7f3d0" font-size="10">- Root Cause &amp; Steps</text>
  </g>

  <!-- Low Confidence Branch (Amber/Red) -->
  <path d="M 910 445 L 950 495" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="920" y="480" fill="#f59e0b" font-size="10" font-weight="700">&lt; 0.70</text>

  <g transform="translate(955, 470)">
    <rect width="180" height="85" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
    <text x="90" y="24" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="800">Low Confidence (25%)</text>
    <text x="90" y="44" text-anchor="middle" fill="#fde68a" font-size="10">- Anti-Hallucination Lock</text>
    <text x="90" y="62" text-anchor="middle" fill="#fde68a" font-size="10">- Zero Bad Code Output</text>
    <text x="90" y="78" text-anchor="middle" fill="#fde68a" font-size="9">Escalates to Human</text>
  </g>

  <!-- ==================== WORKFLOW 3: FLYWHEEL ==================== -->
  <rect x="50" y="720" width="1100" height="160" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="70" y="708" width="280" height="24" rx="6" fill="#7c3aed"/>
  <text x="210" y="725" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="0.5">WORKFLOW 3: ACTIVE LEARNING FLYWHEEL</text>

  <!-- Escalation link down to Flywheel -->
  <path d="M 1045 555 L 1045 650 L 175 650 L 175 755" stroke="#a855f7" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-purple)"/>
  <text x="590" y="642" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="600">Escalated Incident Sent to Senior Engineer Queue</text>

  <!-- Engineer Review Form -->
  <g transform="translate(95, 755)">
    <rect width="185" height="80" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="92" y="32" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700">Engineer Review</text>
    <text x="92" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">Inputs Verified Fix</text>
    <text x="92" y="68" text-anchor="middle" fill="#64748b" font-size="10">Postmortem Metadata</text>
  </g>

  <path d="M 280 795 L 340 795" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Format Runbook -->
  <g transform="translate(345, 755)">
    <rect width="185" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="92" y="32" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">Format Runbook</text>
    <text x="92" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">Standardized Template</text>
    <text x="92" y="68" text-anchor="middle" fill="#64748b" font-size="10">JavaScript Code Node</text>
  </g>

  <path d="M 530 795 L 590 795" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Gemini Embeddings -->
  <g transform="translate(595, 755)">
    <rect width="200" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="100" y="32" text-anchor="middle" fill="#a855f7" font-size="12" font-weight="700">Gemini Embeddings</text>
    <text x="100" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">3,072D Vector Generation</text>
  </g>

  <path d="M 795 795 L 855 795" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pinecone Upsert -->
  <g transform="translate(860, 750)">
    <rect width="255" height="90" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="127" y="30" text-anchor="middle" fill="#34d399" font-size="13" font-weight="800">Pinecone Upsert</text>
    <text x="127" y="50" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="600">Auto-Indexed Solution!</text>
    <text x="127" y="70" text-anchor="middle" fill="#94a3b8" font-size="10">System learns for next time</text>
  </g>

  <!-- Flywheel loop back up to Pinecone -->
  <path d="M 985 750 L 985 225" stroke="#10b981" stroke-width="2" stroke-dasharray="5" marker-end="url(#arrow-green)"/>
  <text x="998" y="270" fill="#10b981" font-size="11" font-weight="700" transform="rotate(90, 998, 270)">FLYWHEEL AUTO-INDEX (SYSTEM LEARNS)</text>
</svg>
